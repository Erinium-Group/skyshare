[package]
name = "sky-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror = "2.0.20"
cudarc = { version = "0.16", default-features = false, features = ["driver", "dynamic-loading"] }
libloading = "0.8"
# Mêmes liaisons que sky-encode : `ci-check` fournit les types sans exiger le SDK
# à la compilation. La DLL est chargée à l'exécution par `libloading`, comme le
# fait sky-encode pour nvEncodeAPI64.dll.
nvidia-video-codec-sdk = { version = "0.4.0", features = ["ci-check"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[features]
# RÉSERVÉE AUX TESTS : expose `DecodeurMf::nouveau_pour_essai_sans_faible_latence`
# (`MF_LOW_LATENCY = 0`), qui sert à prouver le filtre d'horodatage de
# `DecodeurMf::decoder`. Activée UNIQUEMENT par la dépendance de développement
# de cette crate sur elle-même, ci-dessous : avec le résolveur 2, elle n'entre
# dans aucune construction de production. Ne jamais l'activer ailleurs.
essai-sans-faible-latence = []

[dev-dependencies]
# Cette crate elle-même, pour activer la fonctionnalité d'essai dans ses tests
# d'intégration (`tests/media_foundation.rs`) et là seulement.
sky-decode = { path = ".", features = ["essai-sans-faible-latence"] }
png = "0.17"
# Deux usages : ses souches de lien `NvEncodeAPI*` (voir l'en-tête de
# `tests/reference.rs` — un test d'intégration compile la bibliothèque sans
# `cfg(test)`, donc sans les souches internes de `nvcuvid_sys`), et l'encodeur
# lui-même, dont `tests/aller_retour.rs` se sert pour fabriquer un flux d'une
# hauteur que le flux du jalon 0 ne couvre pas.
sky-encode = { path = "../sky-encode" }
# Pour `CapturedFrame`, le type d'entrée de `NvencEncoder::encode`.
sky-capture = { path = "../sky-capture" }
# Les tests créent leur propre périphérique Direct3D 11 : pas de capture
# d'écran, donc aucune fenêtre. Les fonctionnalités s'unissent avec celles de
# la dépendance normale ci-dessus.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
