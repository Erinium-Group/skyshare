[package]
name = "sky-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror = "2.0.20"
cudarc = { version = "0.16", default-features = false, features = ["driver", "dynamic-loading"] }
libloading = "0.8"
# Mêmes liaisons que sky-encode : `ci-check` fournit les types sans exiger le SDK
# à la compilation. La DLL est chargée à l'exécution par `libloading`, comme le
# fait sky-encode pour nvEncodeAPI64.dll.
nvidia-video-codec-sdk = { version = "0.4.0", features = ["ci-check"] }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D11"] }

[dev-dependencies]
png = "0.17"
# Deux usages : ses souches de lien `NvEncodeAPI*` (voir l'en-tête de
# `tests/reference.rs` — un test d'intégration compile la bibliothèque sans
# `cfg(test)`, donc sans les souches internes de `nvcuvid_sys`), et l'encodeur
# lui-même, dont `tests/aller_retour.rs` se sert pour fabriquer un flux d'une
# hauteur que le flux du jalon 0 ne couvre pas.
sky-encode = { path = "../sky-encode" }
# Pour `CapturedFrame`, le type d'entrée de `NvencEncoder::encode`.
sky-capture = { path = "../sky-capture" }
# Les tests créent leur propre périphérique Direct3D 11 : pas de capture
# d'écran, donc aucune fenêtre. Les fonctionnalités s'unissent avec celles de
# la dépendance normale ci-dessus.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
