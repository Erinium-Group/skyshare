[package]
name = "sonde-amd"
version = "0.1.0"
edition = "2021"
publish = false

# Sonde JETABLE de faisabilité : décodage vidéo hors NVIDIA (portable AMD).
# Aucune dépendance NVIDIA, aucun réseau, aucune fenêtre.

[workspace]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
debug = false
panic = "unwind"
