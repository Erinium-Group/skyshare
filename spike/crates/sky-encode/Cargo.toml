[package]
name = "sky-encode"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# "dynamic-loading" : charge nvcuda.dll au runtime (déjà présent avec le driver),
# évite d'installer le CUDA Toolkit juste pour son fichier .lib de link.
cudarc = { version = "0.16", default-features = false, features = ["driver", "dynamic-loading"] }
libloading = "0.8"
# "ci-check" : configuration nominale, pas un contournement. On n'utilise
# jamais le lien statique de cette crate contre nvEncodeAPI.lib/nvcuvid.lib
# (fournis par le NVIDIA Video Codec SDK, un package à part du driver et du
# CUDA Toolkit) : nvEncodeAPICreateInstance est en réalité livrée dans
# nvEncodeAPI64.dll aux côtés du driver, et on la charge dynamiquement nous-
# mêmes via `libloading` (comme FFmpeg/OBS), avant d'appeler tout le reste de
# NVENC à travers la table de pointeurs qu'elle remplit. "ci-check" empêche
# juste le build.rs de cette crate d'exiger un lien statique dont on n'a pas
# besoin. Les types/enums/GUID de `sys` restent utilisés normalement — ce
# sont des définitions, elles ne demandent aucun lien.
nvidia-video-codec-sdk = { version = "0.4.0", features = ["ci-check"] }
thiserror = "2.0.20"
