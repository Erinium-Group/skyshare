[package]
name = "sky-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# `pii` remplace les adresses par {REDACTED} dans les traces de str0m —
# filet de sécurité pour la contrainte « aucune adresse journalisée » (spec §4.2).
str0m = { version = "0.23", features = ["pii"] }
sky-crypto = { path = "../sky-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Même source d'aléa que sky-crypto : identifiants de transaction STUN.
rand_core = { version = "0.6", features = ["getrandom"] }
